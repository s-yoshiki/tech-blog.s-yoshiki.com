packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'
  - 'infra/*'
  - 'scripts/*'
  - 'docs/*'

allowBuilds:
  fsevents: true
  sharp: true
  unrs-resolver: true

catalog:
  '@mdx-js/loader': '^3.1.1'
  '@mdx-js/react': '^3.1.1'
  '@next/mdx': '^16.4.6'
  '@radix-ui/react-slot': '^1.5.0'
  '@shikijs/rehype': '^4.6.0'
  '@tailwindcss/postcss': '^4.3.5'
  '@types/mdx': '^2.0.14'
  '@types/node': '^26.6.10'
  '@types/react': '19.3.3'
  '@types/react-dom': '19.3.0'
  'cheerio': '^1.2.0'
  'class-variance-authority': '^0.7.1'
  'clsx': '^2.1.1'
  'github-slugger': '^2.0.0'
  'gray-matter': '^4.0.3'
  'lucide-react': '^1.80.0'
  'next': '16.4.6'
  'oxfmt': '0.80.0'
  'oxlint': '1.95.0'
  'postcss': '^8.5.33'
  'react': '19.3.1'
